[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "molecularguibench-dock"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2", "PyYAML>=6", "numpy>=1.23"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.6", "scipy>=1.10", "pandas>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "pymol_plugin"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
exclude = [".agents"]

[tool.ruff.lint]
select = ["F"]
ignore = ["F401"]
